<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LET'S TWIST AGAIN!</title>
    <link rel="stylesheet" href="letsTwistAgain.css">

</head>
<body>

    <h1>ADD PLAYERS</h1>

    <form id="playerForm">
        <input type="text" id="playerName" placeholder="Enter player name" required style="text-transform: uppercase;">
        <button type="submit">+</button>
    </form>

    <table id="playerTable">
        <thead>
            <tr>
                <th>Players</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <button id="readyButton">READY!</button>

    <script>
        const maxPlayers = 7;
        const minPlayers = 3;
        const colors = ['#FF5733', '#33FF57', '#3357FF', '#FF33A1', '#FFC300', '#cba39d', '#581845'];
        const players = [];

        const form = document.getElementById('playerForm');
        const playerNameInput = document.getElementById('playerName');
        const playerTableBody = document.querySelector('#playerTable tbody');
        const readyButton = document.getElementById('readyButton');

// Funzione per inviare i dati al Webhook di Make
        function sendPlayerDataToMake(playerName) {
            fetch("https://hook.eu2.make.com/nunoz1blzyn2efvze6k2b2mh68mst97z", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: playerName,
                    timestamp: new Date().toISOString()
                })
            })
            .then(response => response.json())
            .then(data => console.log("Dati inviati a Make:", data))
            .catch(error => console.error("Errore nell'invio dei dati a Make:", error));
        }

        
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const playerName = playerNameInput.value.trim().toUpperCase();

            if (playerName && players.length < maxPlayers && !players.some(p => p.name === playerName)) {
                const playerColor = colors[players.length];
                players.push({ name: playerName, color: playerColor, points: 0 });
                updatePlayerTable();

                  // Invia il nuovo giocatore a Make
                sendPlayerDataToMake(playerName);
                
                if (players.length >= minPlayers) {
                    readyButton.style.display = 'block';
                }
                playerNameInput.value = '';
            }
        });

        function updatePlayerTable() {
            playerTableBody.innerHTML = '';
            players.forEach((player) => {
                const row = document.createElement('tr');
                row.innerHTML = `<td style="background-color: ${player.color}; color: white;">${player.name}</td>`;
                playerTableBody.appendChild(row);
            });
        }

        readyButton.addEventListener('click', function() {
            localStorage.setItem('players', JSON.stringify(players));
            window.location.href = 'game.html'; 
        });
    </script>

</body>
</html>
